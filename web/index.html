<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>证据问答 · 教学基线</title>
<style>body{max-width:860px;margin:45px auto;padding:0 22px;font:16px/1.7 system-ui;background:#f7f8fb;color:#17263a}h1{font-size:30px}section{padding:22px;margin:20px 0;background:white;border:1px solid #dce3ec;border-radius:14px}button{padding:9px 16px;background:#2057be;color:white;border:0;border-radius:7px;cursor:pointer}textarea{width:95%;padding:12px;font:inherit}small{color:#566477}.source{margin:12px 0;padding:10px;background:#eef4ff}#answer{white-space:pre-wrap}input,select{margin:10px 8px 10px 0}</style>
<h1>证据问答</h1><p>上传资料，检索原文，核查来源。教学项目基线 v0.1。</p>
<small>默认使用词法检索和原文摘录。选择模型回答需要服务端配置；上传内容会随该次请求发送给所选模型供应商。</small>
<section><h2>1. 导入资料</h2><input type="file" id="file" accept=".md,.txt"><button id="upload">上传</button><p id="uploadStatus"></p><div id="docs"></div></section>
<section><h2>2. 提问</h2><textarea id="question" rows="3" placeholder="例如：重复导入文档如何处理？"></textarea><br>
<select id="mode"><option value="extractive">原文摘录（无需模型）</option><option value="llm">模型回答（会发送检索片段）</option></select><button id="ask">查找证据</button><p id="answer"></p><div id="sources"></div></section>
<script>
async function request(url,options){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
async function refresh(){const ds=await request('/documents');document.querySelector('#docs').textContent=ds.map(d=>`${d.name} · ${d.chunks} 个片段`).join('；')||'尚未导入资料'}
document.querySelector('#upload').onclick=async()=>{const f=document.querySelector('#file').files[0];if(!f)return;const data=new FormData();data.append('file',f);try{const d=await request('/documents',{method:'POST',body:data});document.querySelector('#uploadStatus').textContent=d.duplicate?'相同正文已存在，沿用原来源名称':`已导入 ${d.chunks} 个片段`;await refresh()}catch(e){document.querySelector('#uploadStatus').textContent=e.message}}
document.querySelector('#ask').onclick=async()=>{const btn=document.querySelector('#ask');btn.disabled=true;document.querySelector('#sources').replaceChildren();document.querySelector('#answer').textContent='检索中…';try{const d=await request('/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:document.querySelector('#question').value,mode:document.querySelector('#mode').value})});document.querySelector('#answer').textContent=d.answer;for(const s of d.sources){const div=document.createElement('div');div.className='source';div.textContent=`${s.source} · 第 ${s.start_line}–${s.end_line} 行 · 词法相似度 ${s.score}\n${s.text}`;document.querySelector('#sources').append(div)}}catch(e){document.querySelector('#answer').textContent=e.message}finally{btn.disabled=false}}
refresh().catch(e=>document.querySelector('#docs').textContent=e.message);
</script></html>
